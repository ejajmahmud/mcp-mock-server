[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-mock-server"
version = "0.1.0"
description = "Spec-driven deterministic mock MCP server for agent integration testing and CI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-mock-server = "mcp_mock_server.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_mock_server*"]
